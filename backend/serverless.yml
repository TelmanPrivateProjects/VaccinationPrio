# =============================================================================
# Vaccination Priority System - serverless backend (AWS, event-driven)
#
# Every function below is an AWS Lambda that only runs in response to an event:
#   - HTTP events      : API Gateway REST endpoints (integration: lambda)
#   - Auth events      : the custom lambdaAuthorizer (/user/*) or Cognito (/admin/*)
#   - Internal events  : Lambda-to-Lambda invocations (e.g. update* -> updatePrio)
#
# Deploy from this folder with:  serverless deploy
# =============================================================================
service: DSG-Task3-M

frameworkVersion: '2 || 3'


provider:
  name: aws
  runtime: python3.8
  lambdaHashingVersion: 20201221
  region: eu-central-1
  environment:
    # Verified Amazon SES sender address for appointment e-mails.
    # Set it before deploying:  export SENDER_EMAIL=noreply@your-domain.example
    SENDER_EMAIL: ${env:SENDER_EMAIL}
    # Function invoked after every profile change to recompute the priority group
    UPDATE_PRIO_FUNCTION: ${self:service}-${sls:stage}-updatePrio

custom:
  # Resolved from the deploying AWS credentials (used in IAM resource ARNs)
  accountID: ${aws:accountId}

# -----------------------------------------------------------------------------
# Functions
#   /user/*  : citizen endpoints, secured by the custom lambdaAuthorizer
#              (the authorizer injects the caller's ID into the request template)
#   /admin/* : health-authority endpoints, secured by the Cognito user pool
#   no event : internal functions, only invoked by other functions
# Each function gets its own least-privilege IAM role
# (plugin: serverless-iam-roles-per-function).
# -----------------------------------------------------------------------------
functions:
  # ---------- Citizen endpoints (/user/*) ----------

  readItem:
    handler: functions/readItem.readItem
    events:
      - http:
          path: user/readitem
          method: post
          integration: lambda
          request:
            template:
              application/json: '{"ID" : $context.authorizer.ID}'          
          authorizer:
            name: lambdaAuthorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
            type: token
    iamRoleStatementsName: readItemM
    iamRoleStatements:
      - Effect: "Allow"
        Action: "dynamodb:GetItem"        
        Resource: 
          - "Fn::GetAtt": [ vaccTableM, Arn ]

  # Public sign-up endpoint (no authorizer)
  writeItem:
    handler: functions/writeItem.writeItem
    events:
      - http:
          path: user/writeitem
          method: post
          integration: lambda
          request:
            template:
              application/json: ''
    iamRoleStatementsName: writeItemM
    iamRoleStatements:
      - Effect: "Allow"        
        Action: "dynamodb:PutItem"        
        Resource: 
          - "Fn::GetAtt": [ vaccTableM, Arn ]

  # Profile updates: each one updates vaccTableM and then invokes updatePrio
  updateLastName:
    handler: functions/update.updateLastName
    events:
      - http:
          path: user/updatelastname
          method: post
          integration: lambda
          request:
            template:
              application/json: '{"ID" : $context.authorizer.ID, "name" : $input.params("name")}'          
          authorizer:
            name: lambdaAuthorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
            type: token       
    iamRoleStatementsName: updateLastNameM
    iamRoleStatements:
      - Effect: "Allow"
        Action: 
          - "dynamodb:UpdateItem"
        Resource: 
          - "Fn::GetAtt": [ vaccTableM, Arn ]
      - Effect: "Allow"
        Action: 
          - "lambda:InvokeFunction"
          - "lambda:GetFunction"
        Resource: "arn:aws:lambda:${self:provider.region}:${self:custom.accountID}:function:DSG-Task3-M-${sls:stage}-updatePrio"          

  updateFirstName:
    handler: functions/update.updateFirstName
    events:
      - http:
          path: user/updatefirstname
          method: post
          integration: lambda
          request:
            template:
              application/json: '{"ID" : $context.authorizer.ID, "vorname" : $input.params("vorname")}'          
          authorizer:
            name: lambdaAuthorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
            type: token    
    iamRoleStatementsName: updateFirstNameM
    iamRoleStatements:
      - Effect: "Allow"
        Action: "dynamodb:UpdateItem"
        Resource: 
          - "Fn::GetAtt": [ vaccTableM, Arn ]
      - Effect: "Allow"
        Action: 
          - "lambda:InvokeFunction"
          - "lambda:GetFunction"
        Resource: "arn:aws:lambda:${self:provider.region}:${self:custom.accountID}:function:DSG-Task3-M-${sls:stage}-updatePrio"              

  updateMail:
    handler: functions/update.updateMail
    events:
      - http:
          path: user/updatemail
          method: post
          integration: lambda
          request:
            template:
              application/json: '{"ID" : $context.authorizer.ID, "mail" : $input.params("mail")}'          
          authorizer:
            name: lambdaAuthorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
            type: token       
    iamRoleStatementsName: updateMailM
    iamRoleStatements:
      - Effect: "Allow"
        Action: "dynamodb:UpdateItem"
        Resource: 
          - "Fn::GetAtt": [ vaccTableM, Arn ]
      - Effect: "Allow"
        Action: 
          - "lambda:InvokeFunction"
          - "lambda:GetFunction"
        Resource: "arn:aws:lambda:${self:provider.region}:${self:custom.accountID}:function:DSG-Task3-M-${sls:stage}-updatePrio"              

  updateBirthday:
    handler: functions/update.updateBirthday
    events:
      - http:
          path: user/updatebirthday
          method: post
          integration: lambda
          request:
            template:
              application/json: '{"ID" : $context.authorizer.ID, "geburtstag" : $input.params("geburtstag")}'          
          authorizer:
            name: lambdaAuthorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
            type: token      
    iamRoleStatementsName: updateBirthdayM
    iamRoleStatements:
      - Effect: "Allow"
        Action: "dynamodb:UpdateItem"
        Resource: 
          - "Fn::GetAtt": [ vaccTableM, Arn ]
      - Effect: "Allow"
        Action: 
          - "lambda:InvokeFunction"
          - "lambda:GetFunction"
        Resource: "arn:aws:lambda:${self:provider.region}:${self:custom.accountID}:function:DSG-Task3-M-${sls:stage}-updatePrio"              

  updateZipcode:
    handler: functions/update.updateZipcode
    events:
      - http:
          path: user/updatezipcode
          method: post
          integration: lambda
          request:
            template:
              application/json: '{"ID" : $context.authorizer.ID, "plz" : $input.params("plz")}'          
          authorizer:
            name: lambdaAuthorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
            type: token     
    iamRoleStatementsName: updateZipcodeM
    iamRoleStatements:
      - Effect: "Allow"
        Action: "dynamodb:UpdateItem"
        Resource: 
          - "Fn::GetAtt": [ vaccTableM, Arn ]
      - Effect: "Allow"
        Action: 
          - "lambda:InvokeFunction"
          - "lambda:GetFunction"
        Resource: "arn:aws:lambda:${self:provider.region}:${self:custom.accountID}:function:DSG-Task3-M-${sls:stage}-updatePrio"              
      
  updateGender:
    handler: functions/update.updateGender
    events:
      - http:
          path: user/updategender
          method: post
          integration: lambda
          request:
            template:
              application/json: '{"ID" : $context.authorizer.ID, "geschlecht" : $input.params("geschlecht")}'          
          authorizer:
            name: lambdaAuthorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
            type: token  
    iamRoleStatementsName: updateGenderM
    iamRoleStatements:
      - Effect: "Allow"
        Action: "dynamodb:UpdateItem"
        Resource: 
          - "Fn::GetAtt": [ vaccTableM, Arn ]
      - Effect: "Allow"
        Action: 
          - "lambda:InvokeFunction"
          - "lambda:GetFunction"
        Resource: "arn:aws:lambda:${self:provider.region}:${self:custom.accountID}:function:DSG-Task3-M-${sls:stage}-updatePrio"              

  updateSysRel:
    handler: functions/update.updateSysRel
    events:
      - http:
          path: user/updatesysrel
          method: post
          integration: lambda
          request:
            template:
              application/json: '{"ID" : $context.authorizer.ID, "systemrelevanz" : $input.params("systemrelevanz")}'          
          authorizer:
            name: lambdaAuthorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
            type: token      
    iamRoleStatementsName: updateSysRelM
    iamRoleStatements:
      - Effect: "Allow"
        Action: "dynamodb:UpdateItem"
        Resource: 
          - "Fn::GetAtt": [ vaccTableM, Arn ]
      - Effect: "Allow"
        Action: 
          - "lambda:InvokeFunction"
          - "lambda:GetFunction"
        Resource: "arn:aws:lambda:${self:provider.region}:${self:custom.accountID}:function:DSG-Task3-M-${sls:stage}-updatePrio"              

  updateHealthPr:
    handler: functions/update.updateHealthPr
    events:
      - http:
          path: user/updatehealthpr
          method: post
          integration: lambda
          request:
            template:
              application/json: '{"ID" : $context.authorizer.ID, "healthPr" : $input.params("healthPr")}'          
          authorizer:
            name: lambdaAuthorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
            type: token      
    iamRoleStatementsName: updateHealthPrM
    iamRoleStatements:
      - Effect: "Allow"
        Action: "dynamodb:UpdateItem"
        Resource: 
          - "Fn::GetAtt": [ vaccTableM, Arn ]
      - Effect: "Allow"
        Action: 
          - "lambda:InvokeFunction"
          - "lambda:GetFunction"
        Resource: "arn:aws:lambda:${self:provider.region}:${self:custom.accountID}:function:DSG-Task3-M-${sls:stage}-updatePrio"             

  # ---------- Admin endpoints (/admin/*) ----------

  # Migrate legacy records (no Version attribute) to the current data model
  updateOldData:
    handler: functions/update.updateOldData
    events:
      - http:
          path: admin/updateolddata
          method: post
          integration: lambda
          request:
            template:
              application/json: ''
          authorizer:
            name: CognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn:
              Fn::GetAtt:
                - CognitoUserPool
                - Arn      
    iamRoleStatementsName: updateOldData
    iamRoleStatements:
      - Effect: "Allow"
        Action: "dynamodb:Query"
        Resource: 
          - "Fn::Join": ['/', ["Fn::GetAtt": [ vaccTableM, Arn ], 'index', 'PLZ-index']]
      - Effect: "Allow"
        Action: 
          - "lambda:InvokeFunction"
          - "lambda:GetFunction"
        Resource: "arn:aws:lambda:${self:provider.region}:${self:custom.accountID}:function:DSG-Task3-M-${sls:stage}-updatePrio"       
      - Effect: "Allow"
        Action: "dynamodb:UpdateItem"
        Resource: 
          - "Fn::GetAtt": [ vaccTableM, Arn ]           

  # Internal: delete a registration (no HTTP event)
  deleteItem:
    handler: functions/deleteItem.deleteItem
    iamRoleStatementsName: deleteItemM
    iamRoleStatements:
      - Effect: "Allow"
        Action: "dynamodb:DeleteItem"        
        Resource: 
          - "Fn::GetAtt": [ vaccTableM, Arn ]

  # Oldest people of a priority group in a zip code area
  specialFunction:
    handler: functions/specialFunction.specialFunction
    events:
      - http:
          path: admin/specialfunction
          method: post
          integration: lambda
          request:
            template:
              application/json: ''
          authorizer:
            name: CognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn:
              Fn::GetAtt:
                - CognitoUserPool
                - Arn    
    iamRoleStatementsName: specialFunctionM
    iamRoleStatements:
      - Effect: "Allow"
        Action: "dynamodb:Scan"        
        Resource: 
          - "Fn::GetAtt": [ vaccTableM, Arn ]

  # Internal event handler: recompute a person's priority group (no HTTP event)
  updatePrio:
    handler: functions/update.updatePrio
    iamRoleStatementsName: updatePrioM
    iamRoleStatements:
      - Effect: "Allow"
        Action: 
          - "dynamodb:Query"
          - "dynamodb:UpdateItem"      
        Resource: 
          - "Fn::GetAtt": [ vaccTableM, Arn ]

  getUserByZipcode:
    handler: functions/getUserByZipcode.getUserByZipcode
    events:
      - http:
          path: admin/getuserbyzipcode
          method: post
          integration: lambda
          request:
            template:
              application/json: ''
          authorizer:
            name: CognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn:
              Fn::GetAtt:
                - CognitoUserPool
                - Arn      
    iamRoleStatementsName: getUserByZipcodeM
    iamRoleStatements:
      - Effect: "Allow"
        Action: "dynamodb:Query"
        Resource: 
          - "Fn::Join": ['/', ["Fn::GetAtt": [ vaccTableM, Arn ], 'index', 'PLZ-index']]

  getUserByPrio:
    handler: functions/getUserByPrio.getUserByPrio
    events:
      - http:
          path: admin/getuserbyprio
          method: post
          integration: lambda
          request:
            template:
              application/json: ''
          authorizer:
            name: CognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn:
              Fn::GetAtt:
                - CognitoUserPool
                - Arn      
    iamRoleStatementsName: getUserByPrioM
    iamRoleStatements:
      - Effect: "Allow"
        Action: "dynamodb:Query"
        Resource: 
          - "Fn::Join": ['/', ["Fn::GetAtt": [ vaccTableM, Arn ], 'index', 'Prio-index']]          

  # Custom TOKEN authorizer for /user/* (token = "<mail>|<sha256(password)>")
  lambdaAuthorizer:
    handler: functions/lambdaAuthorizer.lambda_handler
    iamRoleStatementsName: lambdaAuthorizerM
    iamRoleStatements:
      - Effect: "Allow"
        Action: "dynamodb:Scan"        
        Resource: 
          - "Fn::GetAtt": [ vaccTableM, Arn ]    

  # Add vaccination slots, assign them directly and notify people via SES
  addFreeDates:
    handler: functions/addFreeDates.addFreeDates
    events:
      - http:
          path: admin/addfreedates
          method: post
          integration: lambda
          request:
            template:
              application/json: ''
          authorizer:
            name: CognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn:
              Fn::GetAtt:
                - CognitoUserPool
                - Arn     
    iamRoleStatementsName: addFreeDatesM
    iamRoleStatements:
      - Effect: "Allow"
        Action: 
          - "dynamodb:Query"
          - "dynamodb:UpdateItem"                  
        Resource: 
          - "Fn::GetAtt": [ datesTableM, Arn ]  
      - Effect: "Allow"
        Action: 
          - "dynamodb:UpdateItem"    
        Resource: 
          - "Fn::GetAtt": [ vaccTableM, Arn ]         
      - Effect: "Allow"
        Action: "dynamodb:Query"
        Resource: 
          - "Fn::Join": ['/', ["Fn::GetAtt": [ vaccTableM, Arn ], 'index', 'PLZ-index']]
      - Effect: "Allow"
        Action: "ses:SendEmail"  
        Resource: 
          - arn:aws:ses:${self:provider.region}:${self:custom.accountID}:identity/*              

  # Hand out stored free slots to the next n people and notify them via SES
  distributeDates:
    handler: functions/distributeDates.distributeDates
    events:
      - http:
          path: admin/distributedates
          method: post
          integration: lambda
          request:
            template:
              application/json: ''
          authorizer:
            name: CognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn:
              Fn::GetAtt:
                - CognitoUserPool
                - Arn     
    iamRoleStatementsName: distributeDatesM
    iamRoleStatements:
      - Effect: "Allow"
        Action: 
          - "dynamodb:Query"
          - "dynamodb:UpdateItem"     
          - "dynamodb:DeleteItem"                            
        Resource: 
          - "Fn::GetAtt": [ datesTableM, Arn ]  
      - Effect: "Allow"
        Action: 
          - "dynamodb:UpdateItem"   
        Resource: 
          - "Fn::GetAtt": [ vaccTableM, Arn ]         
      - Effect: "Allow"
        Action: "dynamodb:Query"
        Resource: 
          - "Fn::Join": ['/', ["Fn::GetAtt": [ vaccTableM, Arn ], 'index', 'PLZ-index']]
      - Effect: "Allow"
        Action: "ses:SendEmail"  
        Resource: 
          - arn:aws:ses:${self:provider.region}:${self:custom.accountID}:identity/*              

plugins:
  - serverless-iam-roles-per-function

# -----------------------------------------------------------------------------
# Infrastructure (CloudFormation)
#   CognitoUserPool   : admin accounts and the hosted login UI
#   vaccTableM        : registrations (PK: ID; GSIs: PLZ-index, Prio-index)
#   datesTableM       : free vaccination slots per zip code and day (PK: PLZ, SK: Datum)
# -----------------------------------------------------------------------------
resources:
  Resources:
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: M-user-pool
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: M-user-pool-client
        UserPoolId:
          Ref: CognitoUserPool
        GenerateSecret: false     
        CallbackURLs: 
          - "https://uni-bamberg.de"   
        LogoutURLs:   
          - "https://uni-bamberg.de"   
        AllowedOAuthScopes:
          - email
          - openid
        AllowedOAuthFlows:
          - code
          - implicit   
        SupportedIdentityProviders: 
          - COGNITO    
        AllowedOAuthFlowsUserPoolClient: true  
    UserPoolDomain: 
      Type: AWS::Cognito::UserPoolDomain 
      Properties:
        UserPoolId: !Ref CognitoUserPool 
        Domain: "dsg-task3-m-userpool"         

    vaccTableM:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: vaccTableM
        AttributeDefinitions:
          - AttributeName: ID
            AttributeType: N
          - AttributeName: PLZ
            AttributeType: S       
          - AttributeName: Priorisierungsgruppe
            AttributeType: N                    
        KeySchema:
          - AttributeName: ID
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: PLZ-index
            KeySchema:
              - AttributeName: PLZ
                KeyType: HASH
              - AttributeName: Priorisierungsgruppe
                KeyType: RANGE 
            Projection:
              ProjectionType: 'ALL'     
          - IndexName: Prio-index
            KeySchema:
              - AttributeName: Priorisierungsgruppe
                KeyType: HASH
            Projection:
              ProjectionType: 'ALL'                
        BillingMode: PAY_PER_REQUEST

    datesTableM:
        Type: AWS::DynamoDB::Table
        Properties:
          TableName: datesTableM
          AttributeDefinitions:
            - AttributeName: PLZ
              AttributeType: S
            - AttributeName: Datum
              AttributeType: S                     
          KeySchema:
            - AttributeName: PLZ
              KeyType: HASH
            - AttributeName: Datum
              KeyType: RANGE        
          BillingMode: PAY_PER_REQUEST        